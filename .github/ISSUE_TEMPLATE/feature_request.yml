name: Feature request
description: A new event, provider, flag or command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation in your integration that paylocal cannot handle today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like paylocal to do
      description: A command line example is ideal.
      render: shell
  - type: input
    id: docs
    attributes:
      label: Provider documentation link
      description: If this is a new event or provider, link the page that describes the webhook.
