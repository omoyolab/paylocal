name: Release

# Publishes to npm through Trusted Publishing (OIDC). No npm token is stored anywhere.
# One-time setup on npmjs.com: package Settings → Trusted publisher → GitHub Actions,
# organization "omoyolab", repository "paylocal", workflow "release.yml".

# Two ways to release the version in package.json:
#   1. Push a tag:  git tag v1.2.3 && git push origin v1.2.3
#   2. One click:   Actions → Release → Run workflow (or `gh workflow run release.yml`).
#      This creates and pushes the tag from main, then publishes the same way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest && npm -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Work out the tag
        id: tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Run this from main, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "tag=$PKG" >> "$GITHUB_OUTPUT"
          else
            if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the tag (one-click release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "$TAG already exists; publishing that version if npm does not have it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
      - name: Skip publish if this version is already on npm
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping npm publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
